<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="highScore">🏆 High Score: 0</div>

    <div class="game-header">
        <p class="game-label">MEMORY CHALLENGE</p>
        <h1>Simon Says</h1>
        <h2>Press any key to start</h2>
    </div>

    <div class="btn-container">

        <div class="line-one">
            <div class="btn red" id="red" type="button">1</div>
            <div class="btn yellow" id="yellow" type="button">2</div>
        </div>

        <div class="line-two">
            <div class="btn green" id="green" type="button">3</div>
            <div class="btn purple" id="purple" type="button">4</div>
        </div>

    </div>

    <p class="game-tip">Watch the sequence • Remember it • Repeat it</p>

    <footer class="footer">
    <div class="footer-content">

        <h3>💖 Made with Love by Shubham Verma 💖</h3>

        <p>Built with HTML, CSS & JavaScript 🎮</p>

        <div class="social-icons">

            <a href="https://www.instagram.com/it.is.sv/"
               target="_blank"
               title="Instagram">
                Instagram
            </a>

            <a href="https://www.linkedin.com/in/itissv"
               target="_blank"
               title="LinkedIn">
                LinkedIn
            </a>

            <a href="https://github.com/itissv"
               target="_blank"
               title="GitHub">
                GitHub
            </a>

            <a href="mailto:svshubham87@gmail.com"
               title="Email">
                Email
            </a>

        </div>

        <p class="copyright">
            © 2026 Shubham Verma • Simon Says Game
        </p>

    </div>
</footer>

<script src="script.js"></script>
    <script src="simon.js"></script>
</body>
</html>
